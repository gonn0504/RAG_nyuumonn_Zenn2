[project]
name = "rag-nyuumonn-zenn2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gonn0504", email = "yugo.rerano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
rag-nyuumonn-zenn2 = "rag_nyuumonn_zenn2:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
